name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Better Cooking version
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version and platform
      placeholder: 1.11.4, iPhone / Windows / macOS / Android / Linux
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Recipe note (optional)
      description: A note that shows the problem. Remove anything private.
      render: markdown
